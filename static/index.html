<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>海上搜救协调</title>
<style>body{font:15px/1.6 system-ui,sans-serif;max-width:1200px;margin:30px auto;padding:0 20px;color:#17324d}table{border-collapse:collapse;width:100%;margin:16px 0}th,td{border:1px solid #cbd8e3;padding:8px;text-align:left}th{background:#edf5fb}code{background:#f2f5f7;padding:2px 5px}.card{background:#f7fbfe;border-left:5px solid #2784c7;padding:12px 16px}.covered{color:#1c7c3f;font-weight:600}.pending{color:#a86a00}.review{color:#b3261e;font-weight:600}</style>
<h1>海上搜救协调</h1><div class="card">页面读取实时状态。业务写入通过 README 中的 JSON API 完成，并需要 <code>X-User</code>、<code>X-Role</code>。失联恢复后，扇区覆盖以客户端上报编号去重；海况或航程不合格的上报只进入待核清单，不改变覆盖范围。</div>
<h2>遇险事件</h2><table id="incidents"><thead><tr><th>编号</th><th>船名</th><th>状态</th><th>海况</th><th>负责机构</th><th>版本</th></tr></thead><tbody></tbody></table>
<h2>资源</h2><table id="assets"><thead><tr><th>名称</th><th>类型</th><th>状态</th><th>航程</th><th>适用海况</th></tr></thead><tbody></tbody></table>
<h2>搜索区域</h2><table id="areas"><thead><tr><th>编号</th><th>事件</th><th>状态</th><th>优先级</th><th>资源</th><th>版本</th></tr></thead><tbody></tbody></table>
<h2>搜索扇区</h2><table id="sectors"><thead><tr><th>编号</th><th>区域</th><th>序号</th><th>方位角</th><th>状态</th><th>覆盖资源</th><th>覆盖时间</th></tr></thead><tbody></tbody></table>
<h2>待核清单</h2><table id="reviews"><thead><tr><th>ID</th><th>类型</th><th>原因</th><th>扇区</th><th>状态</th></tr></thead><tbody></tbody></table>
<h2>时间线</h2><ol id="timeline"></ol>
<script>
async function load(){
  const d=await fetch('/api/state').then(r=>r.json());
  const fill=(id,rows,cols)=>{document.querySelector('#'+id+' tbody').innerHTML=rows.map(r=>'<tr>'+cols.map(c=>{
    const [k,cls]=Array.isArray(c)?c:[c];let v=r[k]??'';
    if(k==='status'&&v==='covered')v='<span class="covered">已覆盖</span>';
    if(k==='status'&&v==='pending')v='<span class="pending">待补扫</span>';
    if(k==='status'&&v==='pending_review')v='<span class="review">待核</span>';
    return `<td${cls?` class="${cls(r)}"`:''}>${v}</td>`;
  }).join('')+'</tr>').join('')};
  fill('incidents',d.incidents,['code','vessel_name','status','sea_state','lead_org','version']);
  fill('assets',d.assets,['name','kind','status','range_km','max_sea_state']);
  fill('areas',d.search_areas,['code','incident_id','status','priority','assigned_asset_id','version']);
  fill('sectors',d.sectors,['code','area_id','sequence','bearing_start','status','covered_asset_id','covered_at']);
  fill('reviews',d.review_items,['id','kind','reason','sector_id','status']);
  document.querySelector('#timeline').innerHTML=d.timeline.slice(0,20).map(x=>`<li>${x.created_at} ${x.action} ${x.details}</li>`).join('');
}
load();
</script></html>
